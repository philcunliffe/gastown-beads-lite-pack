scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecats/{{.AgentBase}}"
nudge = "Run gc hook; it checks assigned work first, then routed pool work."
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 3
scale_check = "{{.ConfigDir}}/assets/scripts/gc-beads-lite-scale-check.sh {{.Rig}}/{{.AgentBase}} {{.RigRoot}}"
work_query = "{{.ConfigDir}}/assets/scripts/gc-beads-lite-work-query.sh {{.Rig}}/{{.AgentBase}} {{.RigRoot}}"
sling_query = "BEADS_DIR={{.RigRoot}}/.beads {{.ConfigDir}}/assets/bin/bd update {} --set-metadata gc.routed_to={{.Rig}}/{{.AgentBase}}"

[env]
PATH = "{{.ConfigDir}}/assets/bin:$PATH"
BD_NAME = "bd"
