scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/refinery"
nudge = "Run gc hook; it checks assigned merge work first, then routed refinery work."
pre_start = ["gc gastown-beads-lite worktree-setup {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
max_active_sessions = 1
scale_check = "gc gastown-beads-lite scale-check {{.Rig}}/{{.AgentBase}} {{.RigRoot}}"
work_query = "gc gastown-beads-lite work-query {{.Rig}}/{{.AgentBase}} {{.RigRoot}}"
sling_query = "BEADS_DIR={{.RigRoot}}/.beads gc gastown-beads-lite bd update {} --assignee {{.Rig}}/{{.AgentBase}} --set-metadata gc.routed_to={{.Rig}}/{{.AgentBase}}"

[env]
BD_NAME = "bd"
