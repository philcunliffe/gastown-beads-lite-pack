description = """
Witness patrol — mechanical health-check pass for the rig.

The witness pours a wisp of this formula on every wake and executes the steps
in order. Each pass:

1. Drains any work already assigned to the witness session.
2. Reads and triages the inbox; auto-archives stale protocol mail.
3. Detects stuck polecat sessions via the local LLM-proxy recordings.
4. Recovers beads assigned to agents that are no longer running.
5. Flags refinery beads that have been sitting too long without movement.
6. Drains and exits.

Triggers escalation to the mayor only when a human decision is required.
Routine checks complete silently.

## Beads-Lite Command Note

In gastown-beads-lite rig sessions, translate the `bd ...` examples below to:

```bash
BEADS_DIR=<rig-root>/.beads gc gastown-beads-lite bd ...
```

Inside an agent session, the wrapped `bd` shim on `PATH` and the auto-set
`BEADS_DIR` env var both point at the rig store, so the unprefixed form
just works. Outside an agent session, use the full form.

Beads-lite uses SQLite. Do NOT use Dolt-backed `gc bd` or `gc workflow`
subcommands; they don't exist here. State changes go through
`bd update --status / --assignee / --set-metadata`.

## What the witness never does

- Write code or fix bugs (polecats do that)
- Manage processes (controller handles start/stop/restart/zombies)
- Delete branches after merge (refinery does that)
- Spawn or kill agents directly (mail mayor for human decisions)
- Check gates or convoy completion (those are mayor-level)
"""
formula = "mol-witness-patrol"
version = 1
contract = "graph.v2"
phase = "vapor"

[vars]
[vars.binding_prefix]
description = "Pack binding prefix used in session names"
default = "gastown-beads-lite."

[vars.stuck_threshold_hours]
description = "Hours of LLM-proxy silence before a polecat is considered stuck"
default = "2"

[vars.loop_threshold_hours]
description = "Hours since the last user or tool_result message before a session is considered to be in a tool-call loop"
default = "0.5"

[vars.mail_stale_minutes]
description = "Auto-archive protocol mail older than this many minutes"
default = "30"

[vars.refinery_stale_hours]
description = "Flag refinery beads that have not moved in this many hours"
default = "2"

[vars.patrol_proto]
description = "Formula name to pour for the next patrol cycle"
default = "mol-witness-patrol"

[[steps]]
id = "assigned-work"
title = "Process work already assigned to the witness"
description = """
Drain anything the controller or a sender has already routed to this witness
session before doing periodic checks. The patrol wisp itself is one such
bead — it sits assigned to `$GC_AGENT` and is the root of this run.

**1. List your assigned work:**

```bash
bd list \\
    --assignee="$GC_AGENT" --status=in_progress \\
    --exclude-type=epic --json --limit=20 \\
    > /tmp/witness-assigned.json
```

The patrol wisp's root bead may surface here. That is expected — it is the
in-flight patrol you are running right now. Identify it so you skip it
in the loop below:

```bash
WISP_ID=$(jq -r '.[] | select(.title | test("witness.patrol";"i")) | .id' \\
    /tmp/witness-assigned.json | head -1)
```

**2. For every other assigned bead, decide and act:**

- If the bead is a `HELP:` or `BLOCKED:` recovery item routed from a polecat
  (look at `metadata.gc.routed_to` and notes), follow the action in the
  mail-types table below.
- If the bead is a non-witness work item that somehow ended up assigned to
  this witness, escalate to mayor and clear the assignee:

```bash
gc mail send gastown-beads-lite.mayor/ -s "ESCALATION: witness has non-witness work" \\
    -m "Rig: $GC_RIG
Bead: <id>
Title: <title>
The witness should not be doing implementation work. Routing back to pool."
bd update <id> \\
    --status open --assignee "" \\
    --set-metadata gc.routed_to="$GC_RIG/{{binding_prefix}}polecat"
```

**Exit criteria:** No actionable beads remain assigned to the witness other
than the in-flight patrol wisp.
"""

[[steps]]
id = "inbox-drain"
title = "Drain and triage the inbox"
needs = ["assigned-work"]
description = """
Walk the inbox, categorize each message, auto-archive stale ones, and act on
the rest. Stale protocol messages no longer reflect live state — keep them
out of the witness's mental model.

**0. Reset the patrol-cycle marker file.** The list of beads with active
BLOCKED escalations this cycle drives the priority rule used by
`stuck-session-detection`. Truncate it at the start of every drain:

```bash
: > /tmp/witness-blocked-this-patrol.txt
```

**1. Read inbox:**

```bash
gc mail inbox
```

**2. Categorize by subject prefix and act per the table:**

| Subject contains            | Meaning                                  | Action                                                                                |
|-----------------------------|------------------------------------------|---------------------------------------------------------------------------------------|
| `BLOCKED:` / `HELP:`        | Polecat or refinery needs help           | Inspect bead, peek the session, resolve OR escalate to mayor                          |
| `STUCK POLECAT:`            | Self-generated stuck detection           | Bead+worktree already in this message; act once and archive                           |
| `HANDOFF:`                  | Predecessor handing off context          | Load state, continue work, then archive                                               |
| `LIFECYCLE:` / `SPAWN:`     | Agent lifecycle events                   | Verify hook loaded; no action otherwise                                               |
| `RECOVERED_BEAD:`           | Self-logged recovery                     | Informational — archive                                                               |
| `NOTICE:`                   | Polecat notice (e.g., pre-flight bug)    | Read for awareness; archive if not actionable                                         |

**3. Auto-archive stale protocol mail:**

Protocol messages older than `{{mail_stale_minutes}}` minutes describe state
that has either been handled or has moved on. Archive without acting:

```bash
gc mail inbox --json \\
    | jq -r --arg cutoff "$(date -u -v-{{mail_stale_minutes}}M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \\
            || date -u -d '{{mail_stale_minutes}} minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \\
        '.[] | select(.created_at < $cutoff) | .id' \\
    | while read -r id; do
        gc mail archive "$id"
      done
```

If `gc mail inbox --json` is unavailable, use `gc mail peek <id>` per message
and decide manually. Do not skip stale archive — the next pass will re-see
the same messages and act twice.

**4. For actionable items, do not chain-mail.** If you cannot resolve
something locally:

```bash
gc mail send gastown-beads-lite.mayor/ -s "ESCALATION: <brief reason>" -m "..."
```

Then archive the source mail so this patrol pass does not re-escalate.

**5. For every `BLOCKED:` / `HELP:` mail you process this cycle, stamp the
source bead and record it in the patrol-cycle marker file.** The BLOCKED
escalation carries specific resolution context; `stuck-session-detection`
later in this patrol must defer the (less informative) STUCK warrant for
the same bead until the BLOCKED path is settled.

Polecats file BLOCKED mails as `BLOCKED: <bead-id> - <reason>` with the
bead ID in both the subject and the first line of the body (`Issue: <id>`).
Extract the ID and stamp it:

```bash
gc mail inbox --json \\
    | jq -r '.[] | select(.subject | test("^(BLOCKED|HELP): ";"i")) | .subject' \\
    | sed -n 's/^\\(BLOCKED\\|HELP\\): \\([^ ]*\\).*/\\2/p' \\
    | while read -r blocked_bead; do
        [ -z "$blocked_bead" ] && continue
        bd update "$blocked_bead" \\
            --set-metadata blocked_escalation_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \\
            >/dev/null 2>&1 || true
        echo "$blocked_bead" >> /tmp/witness-blocked-this-patrol.txt
      done
```

The marker file is the in-patrol signal consumed by `stuck-session-detection`.
The bead metadata is durable across cycles for later debugging — it does NOT
participate in dedupe by itself.

**Exit criteria:** Inbox contains only fresh, actionable mail. Every stale
protocol message has been archived. Every BLOCKED/HELP source bead has been
stamped and listed in the patrol-cycle marker file.
"""

[[steps]]
id = "stuck-session-detection"
title = "Detect stuck polecat or refinery sessions"
needs = ["inbox-drain"]
description = """
The controller only detects dead sessions. A polecat or refinery that is
alive but frozen at an interactive prompt or wedged in a tool call is
invisible to the bead store: the bead stays `in_progress` while no work
happens.

Detect this via the local LLM-proxy recordings using two signals:

- **Total silence** — a session's cwd has emitted no LLM exchange in
  `{{stuck_threshold_hours}}` hours while its bead is still in flight.
- **External-progress silence** — a session has been generating LLM
  exchanges but has received no user or tool_result message in
  `{{loop_threshold_hours}}` hours, indicating a tool-call loop with no
  forward progress.

Both polecats and refineries can hit these states. City-scope agents
(mayor, dog) have cwds that don't contain `$GC_RIG` and are not flagged
here — they need a separate watchdog.

**1. List in-progress beads in this rig:**

```bash
bd list \\
    --status in_progress --json --limit=30 \\
    > /tmp/witness-active-beads.json
```

**2. Query proxy recordings for stuck polecat or refinery sessions:**

The query covers BOTH polecat and refinery cwds in this rig, excludes the
witness's own cwd (so the patrol doesn't flag itself), and ORs two signals
together: total LLM silence (any session that has gone quiet) and
external-progress silence (a session still generating exchanges but with no
incoming user or tool_result message — typically a tool-call loop).

The `hyp query` engine is read-only SELECT and rejects `NOW()`, quoted
`INTERVAL '…'`, and `PRAGMA`. Compute cutoff timestamps in shell and
compare against `message_created_at` as ISO strings — ISO-8601 sorts
correctly. The hypaware `ai_gateway_messages` dataset uses a stable
NOT-NULL `role` column, so no schema autodetect is needed.

```bash
TODAY=$(date -u +%Y-%m-%d)
YESTERDAY=$(date -u -v-1d +%Y-%m-%d 2>/dev/null || date -u -d 'yesterday' +%Y-%m-%d)

# Convert hour thresholds (may be fractional) to integer minutes so BSD
# `date -v-NM` accepts them. `bc -l` keeps fractions; awk truncates.
STUCK_MINUTES=$(echo "{{stuck_threshold_hours}} * 60" | bc -l | awk '{printf "%d", $1}')
LOOP_MINUTES=$(echo  "{{loop_threshold_hours}} * 60"  | bc -l | awk '{printf "%d", $1}')

STUCK_CUTOFF=$(date -u -v-${STUCK_MINUTES}M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \\
    || date -u -d "${STUCK_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%SZ)
LOOP_CUTOFF=$(date -u -v-${LOOP_MINUTES}M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \\
    || date -u -d "${LOOP_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%SZ)

WITNESS_CWD="${PWD:-$(pwd)}"

hyp query sql "
    SELECT cwd,
           MAX(message_created_at) AS last_any,
           MAX(CASE WHEN role IN ('user', 'tool_result') THEN message_created_at END) AS last_external_input,
           COUNT(*) AS parts
    FROM ai_gateway_messages
    WHERE cwd IS NOT NULL
      AND (cwd LIKE '%/polecats/%' OR cwd LIKE '%/refinery%')
      AND cwd LIKE '%$GC_RIG%'
      AND cwd != '$WITNESS_CWD'
    GROUP BY cwd
    HAVING MAX(message_created_at) < '$STUCK_CUTOFF'
       OR MAX(CASE WHEN role IN ('user', 'tool_result') THEN message_created_at END) < '$LOOP_CUTOFF'
    ORDER BY last_any ASC
" --format json --date "$TODAY" --date "$YESTERDAY" \\
    > /tmp/witness-stuck.json 2>/dev/null || echo '[]' > /tmp/witness-stuck.json
```

If `hyp query` is unavailable or errors, fall back to `gc session peek`:
open each polecat or refinery session, look at the last 80 lines; if they
end with an unanswered tool prompt or an `AskUserQuestion`-style UI, treat
as stuck.

**3. For each stuck cwd, cross-reference with the active-beads list and
escalate ONCE per stuck session per patrol.** Each escalation produces
THREE artifacts: a STUCK warrant bead routed to the dog (the actionable
durable record), a mail to mayor (human visibility), and a
`witness_stuck_flagged_at` stamp on the source bead (dedupe guard):

```bash
jq -c '.[]' /tmp/witness-stuck.json | while read -r row; do
    CWD=$(echo "$row" | jq -r '.cwd')
    LAST=$(echo "$row" | jq -r '.last_any')
    # Find the bead whose worktree matches CWD (polecats record work_dir)
    BEAD=$(jq -r --arg cwd "$CWD" \\
        '.[] | select(.metadata.work_dir == $cwd) | .id' \\
        /tmp/witness-active-beads.json | head -1)
    # Fallback: refinery sessions may not record metadata.work_dir on
    # their bead; if the stuck cwd looks like a refinery, identify the
    # bead via assignee match instead.
    if [ -z "$BEAD" ]; then
        case "$CWD" in
            */refinery*)
                REFINERY_AGENT="$GC_RIG/{{binding_prefix}}refinery"
                BEAD=$(jq -r --arg a "$REFINERY_AGENT" \\
                    '.[] | select(.assignee == $a) | .id' \\
                    /tmp/witness-active-beads.json | head -1)
                ;;
        esac
    fi
    [ -z "$BEAD" ] && continue
    # Skip if we already escalated this bead in a recent patrol
    EXISTING=$(bd show "$BEAD" --json \\
        | jq -r '.[0].metadata.witness_stuck_flagged_at // empty')
    [ -n "$EXISTING" ] && continue
    # Priority rule: if the same bead also produced a BLOCKED/HELP
    # escalation in this patrol cycle, defer the STUCK warrant — the
    # BLOCKED path carries specific resolution context and may resolve
    # before the next cycle, making the warrant unnecessary.
    if [ -f /tmp/witness-blocked-this-patrol.txt ] \\
        && grep -qFx "$BEAD" /tmp/witness-blocked-this-patrol.txt; then
        echo "stuck-detection: deferring $BEAD; BLOCKED escalation already handled this cycle"
        continue
    fi

    gc mail send gastown-beads-lite.mayor/ -s "STUCK POLECAT: $BEAD ($GC_RIG)" \\
      -m "Rig: $GC_RIG
Bead: $BEAD
Worktree: $CWD
Last LLM activity: $LAST
Hours idle: >= {{stuck_threshold_hours}}
Likely cause: polecat hung at interactive prompt or otherwise frozen.
Recommended action: a STUCK warrant has been filed; the dog pool will run
its 3-attempt shutdown dance against this worktree. Inspect with
gc session peek <session-name> --lines 80 if you want a live view."

    bd update "$BEAD" \\
      --notes "Witness flagged stuck: $LAST" \\
      --set-metadata witness_stuck_flagged_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

    # File a STUCK warrant routed to the dog pool. The dog override
    # (agents/dog/prompt.template.md) reads metadata.target,
    # metadata.reason, metadata.requester, and metadata.source_bead and
    # runs a 3-attempt shutdown dance (60s/120s/240s) against the target
    # before pardoning or killing.
    WARRANT_ID=$(bd create "STUCK WARRANT: $BEAD ($GC_RIG)" \\
        --description "Witness flagged session as stuck at $LAST.
Stuck bead: $BEAD
Worktree: $CWD
Hours idle: >= {{stuck_threshold_hours}}
Filed by: witness ${GC_AGENT:-witness}

The dog should run its 3-attempt shutdown dance (60s/120s/240s) against
the session associated with this worktree, then pardon or kill per the
dog's prompt." \\
        --json | jq -r '.id // .[0].id // empty')

    if [ -n "$WARRANT_ID" ]; then
        bd update "$WARRANT_ID" \\
            --set-metadata gc.routed_to="gastown-beads-lite.dog" \\
            --set-metadata target="$CWD" \\
            --set-metadata reason="hyp LLM silence >= {{stuck_threshold_hours}}h" \\
            --set-metadata requester="${GC_AGENT:-witness}" \\
            --set-metadata source_bead="$BEAD"
        echo "stuck-detection: filed warrant $WARRANT_ID for $BEAD (dog will handle)"
    else
        echo "stuck-detection: WARN: bd create failed for warrant of $BEAD" >&2
    fi
done
```

The `witness_stuck_flagged_at` metadata is the dedupe guard. Subsequent
patrol cycles see it and skip re-escalating until the bead's status changes
or a polecat clears the flag on resume. The warrant bead is the *action*
(the dog acts on it); the mail to mayor is *visibility* (the human sees
the rig escalated something); the stamp is *bookkeeping* (so this patrol
does not loop). All three are required.

If `bd create` fails for the warrant, the mail+stamp path still completes
— the human visibility and dedupe survive even when the dog handoff
breaks. The warning line is enough for a mayor reading the patrol log to
notice the gap.

**Exit criteria:** Every fresh stuck-state has produced exactly one
warrant bead, one mail to mayor, and one bead note. Beads that already
produced a BLOCKED/HELP escalation this cycle are deferred to the next
patrol. The patrol does not loop on the same stuck bead.
"""

[[steps]]
id = "orphan-recovery"
title = "Recover beads assigned to absent agents"
needs = ["stuck-session-detection"]
description = """
A bead is orphaned when its assignee names an agent that is not running
and will not be restarted (pool resized down, agent removed from config,
controller quarantined a crash-looping session). The drain protocol does
not release beads — they sit assigned forever unless the witness recovers
them.

**1. Build the alive-sessions set:**

```bash
gc session list --state active --json \\
    | jq -r '.[] | (.SessionName, .Alias, .AgentName, .ID)' \\
    | sort -u > /tmp/witness-alive.txt
```

**2. Identify orphan candidates:**

```bash
bd list \\
    --status in_progress --json --limit=50 \\
    | jq -r '.[] | "\\(.id)\\t\\(.assignee // \"\")"' \\
    | while IFS=$'\\t' read -r id assignee; do
        [ -z "$assignee" ] && continue
        if ! grep -qFx "$assignee" /tmp/witness-alive.txt; then
            echo "$id\\t$assignee"
        fi
      done > /tmp/witness-orphan-candidates.tsv
```

A candidate is not always a true orphan. The controller restarts crashed
agents and formula step resumption handles the worktree on its own. Before
recovering, confirm the assignee names a role that has been removed (no
agent template, pool size zero) — not one that is simply between restarts.

**3. For each confirmed orphan, follow the canonical-chain decision tree:**

```text
worktree -> (push) -> branch -> (merge) -> target branch
   canonical         canonical            canonical
   until push        until merge          forever
```

Read `metadata.work_dir` and `metadata.branch` from the bead. Each
transition moves the canonical location of the work forward.

a. **Branch on origin (verified)** -> worktree is disposable.
   ```bash
   git -C <rig-root> fetch origin <branch>  # confirm it exists
   git -C <rig-root> worktree remove <work_dir> --force 2>/dev/null || true
   ```

b. **Worktree exists, unpushed commits** -> push and make the branch
   canonical, then remove the worktree.
   ```bash
   git -C <work_dir> add -A
   git -C <work_dir> commit -m "wip: salvaged by witness" || true
   git -C <work_dir> push -u origin HEAD:<branch>
   git -C <rig-root> worktree remove <work_dir> --force 2>/dev/null || true
   ```

c. **Worktree with only uncommitted/untracked changes** -> same as (b). All
   work is useful — never discard.

d. **No worktree, no branch on origin** -> nothing to salvage.

**4. Re-check status, then reset the bead to the pool:**

The candidate list was captured in step 1. The bead may have been closed
by mayor, by the agent itself finishing work, or by the refinery merging
between then and now. **Never re-open a closed bead** — re-check status
immediately before each reset and skip if it's no longer `in_progress`:

```bash
CURRENT_STATUS=$(bd show <id> --json | jq -r '.[0].status // empty')
if [ "$CURRENT_STATUS" != "in_progress" ]; then
    echo "orphan-recovery: skipping <id>; status is now '$CURRENT_STATUS' (closed during patrol)"
    continue
fi

bd update <id> \\
    --status open --assignee "" \\
    --set-metadata gc.routed_to="$GC_RIG/{{binding_prefix}}polecat" \\
    --notes "Recovered by witness: assignee <old> was not alive"
```

**5. Notify mayor ONLY for unexpected recoveries.** Routine pool-resize
recoveries do not need mail. Mail mayor when:

- The recovery salvaged unpushed commits or untracked work (data was at risk)
- The same bead has been recovered multiple times (look for prior
  `recovered_at` metadata)
- The recovery happened mid-implementation (agent crashed, not drained)

```bash
gc mail send gastown-beads-lite.mayor/ -s "RECOVERED_BEAD: <id> ($GC_RIG)" \\
    -m "Rig: $GC_RIG
Bead: <id>
Former assignee: <old>
Salvage path: <a|b|c|d>
Reason for mailing: <crash mid-work | repeat recovery | unpushed commits>"
```

**6. Do NOT recover beads for agents that are simply restarting.** If the
agent template still exists and the pool target is non-zero, the controller
will respawn it and formula resumption picks up where it left off. Give it
time.

**Exit criteria:** No in_progress bead is assigned to a session that no
longer exists and will not be restarted.
"""

[[steps]]
id = "refinery-queue-health"
title = "Flag stale refinery work"
needs = ["orphan-recovery"]
description = """
Refinery beads should move within minutes of being claimed. A bead that has
been assigned to the refinery for more than `{{refinery_stale_hours}}` hours
without an update is stuck — typically a hung merge run, a stranded PR
validation, or a session that drained without closing the bead.

**1. List refinery-assigned open beads:**

```bash
bd list \\
    --assignee "$GC_RIG/{{binding_prefix}}refinery" \\
    --status open --json --limit=20 \\
    > /tmp/witness-refinery.json
```

Also check in_progress beads claimed by the refinery agent:

```bash
bd list \\
    --status in_progress --json --limit=30 \\
    | jq '[.[] | select(.assignee | test("refinery";"i"))]' \\
    > /tmp/witness-refinery-active.json
```

**2. Flag beads older than the stale threshold:**

```bash
CUTOFF=$(date -u -v-{{refinery_stale_hours}}H +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \\
    || date -u -d '{{refinery_stale_hours}} hours ago' +%Y-%m-%dT%H:%M:%SZ)

jq -r --arg cutoff "$CUTOFF" \\
    '.[] | select(.updated_at < $cutoff) | .id' \\
    /tmp/witness-refinery.json /tmp/witness-refinery-active.json \\
    | sort -u | while read -r id; do
        # Dedupe: skip if already flagged this cycle
        EXISTING=$(bd show "$id" --json \\
            | jq -r '.[0].metadata.witness_refinery_stale_at // empty')
        [ -n "$EXISTING" ] && continue

        gc session nudge "$GC_RIG/{{binding_prefix}}refinery" \\
            "Run gc hook; bead $id has been waiting >{{refinery_stale_hours}}h."

        bd update "$id" \\
            --notes "Witness flagged stale in refinery queue: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \\
            --set-metadata witness_refinery_stale_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      done
```

**3. Escalate to mayor only when the queue has been stale for multiple
patrol cycles.** A single stale bead nudges the refinery; a persistent
stale queue escalates:

```bash
STALE_COUNT=$(jq 'length' /tmp/witness-refinery.json)
if [ "$STALE_COUNT" -ge 3 ]; then
    gc mail send gastown-beads-lite.mayor/ -s "ESCALATION: refinery queue backed up ($GC_RIG)" \\
        -m "Rig: $GC_RIG
Open refinery beads: $STALE_COUNT
The refinery has not drained in {{refinery_stale_hours}}h.
Inspect: gc session peek $GC_RIG/{{binding_prefix}}refinery --lines 80"
fi
```

Send one escalation per backed-up queue per patrol, not per bead.

**Exit criteria:** Stale refinery beads have been nudged and noted; a
persistent backup has produced one mayor escalation per patrol cycle.
"""

[[steps]]
id = "pour-next-or-rest"
title = "Pour the next patrol cycle or rest"
needs = ["refinery-queue-health"]
description = """
The patrol is complete. The witness should drain so the controller can
recycle the session; the next wake (from new mail, a nudge, or the
controller's idle timer) will pour a fresh `{{patrol_proto}}` wisp.

Do NOT pour another patrol wisp immediately in the same session. The pour
should be the first action of the *next* incarnation, driven by the
controller's wake cycle. Pouring back-to-back here risks runaway loops if
the controller does not enforce a cooldown.

**1. Confirm there is no pending work that requires staying awake:**

```bash
bd list \\
    --assignee="$GC_AGENT" --status=in_progress \\
    --exclude-type=epic --json --limit=5
```

If anything other than the in-flight patrol wisp is returned, loop back to
`assigned-work` and process it. Otherwise:

**2. Drain and exit:**

```bash
gc runtime drain-ack
exit
```

The controller schedules the next wake. When the witness comes back, its
startup protocol pours a fresh patrol wisp and the cycle repeats.

**Context-exhaustion shortcut:** If your context has filled during patrol
and you cannot complete the remaining steps cleanly, request a restart
instead of partial-draining:

```bash
gc runtime request-restart
```

This blocks until the controller kills the session. The new session
re-reads the formula and resumes from a fresh patrol.

**Exit criteria:** The witness session is drained-acked and exited cleanly,
or has requested a restart. The next wake will pour a new patrol wisp.
"""
